version: "2"
sql:
  - schema: "migrations"
    queries: 
      - "internal/auth/queries.sql"
      - "internal/category/queries.sql"
      - "internal/product/queries.sql"
      - "internal/cart/queries.sql"
      - "internal/address/queries.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "sqlc/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        overrides:
          - column: "orders.status"
            go_type:
              import: "github.com/gumla-hds/gumla-backend/internal/types"
              type: "OrderStatus"
          - column: "users.role"
            go_type:
              import: "github.com/gumla-hds/gumla-backend/internal/types"
              type: "UserRole"
