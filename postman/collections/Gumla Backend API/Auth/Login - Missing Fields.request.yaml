$kind: http-request
name: 'Login - Missing Fields'
description: |-
  Negative test — verifies that the login endpoint returns `400 BAD_REQUEST` when the required `id_token` field is omitted from the request body.
method: POST
url: '{{base_url}}/api/v1/auth/login'
order: 2000
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "phone": "+919876543210"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Response has error code BAD_REQUEST", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.error.code).to.eql("BAD_REQUEST");
      });
