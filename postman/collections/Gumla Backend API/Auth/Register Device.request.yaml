$kind: http-request
name: 'Register Device'
description: |-
  Registers or updates an FCM (Firebase Cloud Messaging) push notification token for the authenticated user's device. Uses upsert logic — calling this again with a new token updates the existing record.

  **Auth:** Bearer token required (`Authorization: Bearer {{access_token}}`)

  **Request Body**
  | Field | Type | Required | Description |
  |---|---|---|---|
  | `fcm_token` | string | ✅ | Firebase Cloud Messaging device token |
  | `device_info` | string | ❌ | JSON string with device metadata (e.g. platform, model) |

  **Response `204 No Content`** — Empty body on success.

  **Errors**
  | Status | Code | Reason |
  |---|---|---|
  | 400 | `BAD_REQUEST` | Missing `fcm_token` |
  | 401 | `UNAUTHORIZED` | Missing or invalid access token |
method: POST
url: '{{base_url}}/api/v1/auth/register-device'
order: 6000
body:
  type: json
  content: |-
    {
      "fcm_token": "sample_fcm_token_for_testing",
      "device_info": "{\"platform\":\"android\",\"model\":\"Pixel 6\"}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });

      pm.test("Response body is empty", function () {
          pm.expect(pm.response.text()).to.be.empty;
      });
