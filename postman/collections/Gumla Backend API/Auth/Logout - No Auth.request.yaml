$kind: http-request
name: 'Logout - No Auth'
description: |-
  Negative test — verifies that the logout endpoint returns `401 UNAUTHORIZED` when called without a Bearer token.
method: POST
url: '{{base_url}}/api/v1/auth/logout'
order: 9000
auth:
  type: noauth
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
