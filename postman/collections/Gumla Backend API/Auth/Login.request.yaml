$kind: http-request
name: 'Login'
description: |-
  Authenticates a user via Firebase phone OTP. Verifies the Firebase ID token, looks up or creates the user by phone number, and returns a JWT access/refresh token pair.

  **Auth:** None required

  **Request Body**
  | Field | Type | Required | Description |
  |---|---|---|---|
  | `phone` | string | ✅ | E.164 formatted phone number (e.g. `+919876543210`) |
  | `id_token` | string | ✅ | Firebase ID token obtained after OTP verification |

  **Response `200 OK`**
  ```json
  {
    "success": true,
    "data": {
      "user": { "id": 1, "phone": "+919876543210", "name": "", "role": "customer" },
      "access_token": "<jwt>",
      "refresh_token": "<jwt>"
    }
  }
  ```

  **Errors**
  | Status | Code | Reason |
  |---|---|---|
  | 400 | `BAD_REQUEST` | Missing fields or phone mismatch |
  | 401 | `UNAUTHORIZED` | Invalid or expired Firebase ID token |

  > 💡 On success, `access_token` and `refresh_token` are automatically saved to the active environment.
method: POST
url: '{{base_url}}/api/v1/auth/login'
order: 1000
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "phone": "+919876543210",
      "id_token": "{{firebase_id_token}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has access_token", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property("access_token");
      });

      pm.test("Response has refresh_token", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property("refresh_token");
      });

      pm.test("Response has user object with id, phone, role", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.data.user).to.have.property("id");
          pm.expect(jsonData.data.user).to.have.property("phone");
          pm.expect(jsonData.data.user).to.have.property("role");
      });

      if (pm.response.code === 200) {
          const jsonData = pm.response.json();
          pm.environment.set("access_token", jsonData.data.access_token);
          pm.environment.set("refresh_token", jsonData.data.refresh_token);
      }
