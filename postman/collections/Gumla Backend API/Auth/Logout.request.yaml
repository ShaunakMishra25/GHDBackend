$kind: http-request
name: 'Logout'
description: |-
  Logs out the authenticated user by blacklisting the current access token and optionally the refresh token. Both tokens are added to the token blacklist table and will be rejected on future requests.

  **Auth:** Bearer token required (`Authorization: Bearer {{access_token}}`)

  **Request Body**
  | Field | Type | Required | Description |
  |---|---|---|---|
  | `refresh_token` | string | ❌ | If provided, the refresh token is also revoked |

  **Response `204 No Content`** — Empty body on success.

  **Errors**
  | Status | Code | Reason |
  |---|---|---|
  | 401 | `UNAUTHORIZED` | Missing or invalid access token |

  > 💡 On success, `access_token` and `refresh_token` are automatically cleared from the active environment.
method: POST
url: '{{base_url}}/api/v1/auth/logout'
order: 8000
body:
  type: json
  content: |-
    {
      "refresh_token": "{{refresh_token}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });

      pm.test("Response body is empty", function () {
          pm.expect(pm.response.text()).to.be.empty;
      });

      if (pm.response.code === 204) {
          pm.environment.unset("access_token");
          pm.environment.unset("refresh_token");
      }
