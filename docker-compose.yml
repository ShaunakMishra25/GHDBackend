version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gumla_hds
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/gumla_hds?sslmode=disable"
      JWT_SECRET: "dev-secret-64-chars-minimum-change-this-in-production-bla"
      GIN_MODE: "debug"
    depends_on:
      - postgres

volumes:
  pgdata:
